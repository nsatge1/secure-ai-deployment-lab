# Secure AI Deployment Lab: service definitions.
# Values come from .env (read automatically by Docker Compose, never committed).

name: secure-ai-lab

services:
  db:
    # VERIFY: tag on Docker Hub (pgvector/pgvector). Pinned by digest in step 8.
    image: pgvector/pgvector:pg17
    # Run as the image's unprivileged "postgres" user, never as root.
    user: postgres
    # Only the variables this container needs (least privilege): no env_file,
    # so API_KEY and future secrets never reach the database container.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is missing in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing in .env}
      DB_READER_PASSWORD: ${DB_READER_PASSWORD:?DB_READER_PASSWORD is missing in .env}
      DB_INGEST_PASSWORD: ${DB_INGEST_PASSWORD:?DB_INGEST_PASSWORD is missing in .env}
    volumes:
      # Named volume: data survives `make down`, removed only by `make clean`.
      - db-data:/var/lib/postgresql/data
      # Init scripts, run once on an empty volume. Mounted read-only.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # No "ports:" section: the database is never reachable from the host.
    networks:
      - backend
    healthcheck:
      # $$ escapes $ for Compose, so the variable is expanded inside the container.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ollama:
    build: ./ollama
    image: secure-ai-lab/ollama:local
    volumes:
      # Read-only: the running model server cannot alter or replace the models.
      - ollama-models:/models:ro
    # No "ports:" section, and only the internal network: no Internet, no host access.
    networks:
      - backend
    healthcheck:
      # "ollama list" succeeds only if the server answers.
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api:
    build: ./api
    image: secure-ai-lab/api:local
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # "app": reached by Nginx (step 7). "backend": reaches the database and Ollama.
    # No "ports:" section: the API is never exposed directly.
    networks:
      - app
      - backend
    healthcheck:
      # The slim image has no curl: Python's standard library does the check.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  models-pull:
    build: ./ollama
    image: secure-ai-lab/ollama:local
    # Not started by "make up": only by "make models".
    profiles: ["tools"]
    entrypoint: ["/usr/local/bin/pull-models.sh"]
    environment:
      # VERIFY: model names on https://ollama.com/library. Override them in .env if needed.
      CHAT_MODEL: ${CHAT_MODEL:-llama3.2:3b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
    volumes:
      # Read-write: this is the only container allowed to write models.
      - ollama-models:/models
      - ./ollama/pull-models.sh:/usr/local/bin/pull-models.sh:ro
    # Only this network has Internet access; it is NOT connected to "backend".
    networks:
      - models-pull

networks:
  # Internal network between Nginx (step 7) and the API. No route to the Internet.
  app:
    internal: true
  # Internal network: no route to the Internet. API, database and Ollama share it.
  backend:
    internal: true
  # Regular network with Internet access, used only while downloading models.
  models-pull: {}

volumes:
  db-data:
  ollama-models:
